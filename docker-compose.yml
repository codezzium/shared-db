services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: shared-db
    restart: unless-stopped
    shm_size: 512mb
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres -h localhost -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shared-db-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: shared-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: pgbouncer_auth
      DB_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
      AUTH_TYPE: scram-sha-256
    # Pool sizes and per-user budgets are maintained in pgbouncer.ini.
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      shared-db-internal:
        ipv4_address: 10.250.0.10
      shared-db-net:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: shared-pgadmin
  #   restart: unless-stopped
  #   env_file: .env
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  #   ports:
  #     - "127.0.0.1:9090:80"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   networks:
  #     - shared-db-net
  #   logging:
  #     driver: "none"

  pgbackup:
    build: ./scripts
    container_name: shared-pgbackup
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?BACKUP_PASSWORD is required}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?PGBOUNCER_AUTH_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./rclone:/root/.config/rclone
      - ./scripts:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - shared-db-internal
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
  pgadmin_data:

networks:
  shared-db-net:
    name: shared-db-net
    driver: bridge
  shared-db-internal:
    name: shared-db-internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.0.0/24
          ip_range: 10.250.0.128/25
