name: plausible

services:
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12.6.70-alpine
    container_name: plausible-clickhouse
    restart: unless-stopped
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1536m}
    memswap_limit: ${CLICKHOUSE_MEM_LIMIT:-1536m}
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      CLICKHOUSE_DB: plausible_events_db
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    container_name: plausible
    restart: unless-stopped
    mem_limit: ${PLAUSIBLE_MEM_LIMIT:-1g}
    memswap_limit: ${PLAUSIBLE_MEM_LIMIT:-1g}
    command: sh -c "/entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_events_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PLAUSIBLE_PORT:-18180}:8000"
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      TMPDIR: /var/lib/plausible/tmp
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      TOTP_VAULT_KEY: ${TOTP_VAULT_KEY:?TOTP_VAULT_KEY is required}
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      ENABLE_EMAIL_VERIFICATION: "false"
      HTTP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
    networks:
      - internal
      - shared-db-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  event-data:
  event-logs:
  plausible-data:

networks:
  internal:
    internal: true
  shared-db-net:
    external: true
