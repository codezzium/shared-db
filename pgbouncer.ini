# Pooling settings are maintained here; docker-compose mounts this file read-only.
# Every project role may open up to max_user_connections server connections; keep their sum below Postgres max_connections (100).
################## Auto generated ##################
[databases]
* = host=db port=5432
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = 
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = hba
auth_hba_file = /etc/pgbouncer/pgbouncer_hba.conf
auth_user = pgbouncer_auth
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)
auth_dbname = postgres
pool_mode = transaction
max_client_conn = 500
default_pool_size = 15
min_pool_size = 1
reserve_pool_size = 5
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits

# Log settings
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

# Connection sanity checks, timeouts

# TLS settings

